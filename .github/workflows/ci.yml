name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest, coverage gate on security-sensitive modules)
        run: >
          pytest --cov=zerokyc.webhooks --cov=zerokyc.idempotency
          --cov-report=term --cov-fail-under=90

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build

      - name: Metadata validation (twine check)
        run: twine check dist/*

      - name: Wheel contains py.typed
        run: python -m zipfile -l dist/*.whl | grep -q "zerokyc/py.typed"

      - name: Artifacts contain no __pycache__ or .pyc
        run: |
          ! python -m zipfile -l dist/*.whl | grep -E "__pycache__|\.pyc|\.coverage|coverage\.xml|htmlcov"
          ! tar -tzf dist/*.tar.gz | grep -E "__pycache__|\.pyc|\.coverage|coverage\.xml|htmlcov"

      - name: Clean install from the built wheel
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/python - <<'PY'
          import zerokyc
          from zerokyc import ZeroKYC
          from pathlib import Path
          assert zerokyc.__version__ == "0.1.0"
          assert (Path(zerokyc.__file__).parent / "py.typed").is_file()
          print("clean wheel install OK:", zerokyc.__version__)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
