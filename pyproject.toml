[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zkp-sdk-python"
version = "0.1.0"
description = "Official Python SDK for the ZeroKYC Pay crypto payment gateway (no-KYC checkout for digital services)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "ZeroKYC Payments", homepage = "https://zerokyc-payments.com" }]
keywords = [
    "zerokyc", "crypto", "payments", "gateway", "usdt", "bitcoin",
    "monero", "ton", "webhooks", "sdk",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://zerokyc-payments.com/"
Documentation = "https://zerokyc-payments.com/docs"
Source = "https://github.com/zerokyc-payments/zkp-sdk-python"
Issues = "https://github.com/zerokyc-payments/zkp-sdk-python/issues"
Changelog = "https://github.com/zerokyc-payments/zkp-sdk-python/blob/main/CHANGELOG.md"
Security = "https://github.com/zerokyc-payments/zkp-sdk-python/blob/main/SECURITY.md"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pytest-cov>=5"]

[tool.hatch.build.targets.wheel]
packages = ["src/zerokyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
